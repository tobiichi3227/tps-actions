name: Build tests

on:
  workflow_call:
    inputs:
      input:
        description: 'Problem labels to build inputs'
        type: string
        default: ''
      output:
        description: 'Problem labels to build outputs'
        type: string
        default: ''
      solutions:
        description: 'Problem labels to run solutions'
        type: string
        default: ''
      runs-on:
        default: 'ubuntu-latest'
        required: false
        type: string
      timeout-minutes:
        default: 15
        required: false
        type: number

jobs:
  pre-build:
    runs-on: ${{ inputs.runs-on }}
    container:
      image: tobiichi3227/tps-github-runner
      options: --user root
    timeout-minutes: 3
    outputs:
      problems: ${{ steps.run-problems.outputs.problemsjson }}
      input: ${{ env.REQIN }}
      output: ${{ env.REQOUT }}
      solutions: ${{ env.REQSOL }}
      solfile-changes: ${{ steps.changes.outputs.solfile-changes }}
    steps:
      - uses: actions/checkout@v3

      - name: Allow Git to access workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get changes
        if: github.event_name == 'push'
        id: changes
        uses: tobiichi3227/tps-actions/.github/actions/get-changes@dev

      - name: Set solfile-changes default
        if: github.event_name != 'push'
        run: echo "SOLFILE_CHANGES={}" >> $GITHUB_ENV

      - name: Check push
        if: github.event_name == 'push'
        env:
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          echo "$CHANGES"
          echo "REQUEST=${{ fromJson(steps.changes.outputs.changes).tests }}" >> $GITHUB_ENV
          echo "REQIN=${{ fromJson(steps.changes.outputs.changes).input }}" >> $GITHUB_ENV
          echo "REQOUT=${{ fromJson(steps.changes.outputs.changes).output }}" >> $GITHUB_ENV
          echo "REQSOL=${{ fromJson(steps.changes.outputs.changes).solutions }}" >> $GITHUB_ENV

      - name: Check dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "REQUEST=${{ inputs.input }}${{ inputs.output }}${{ inputs.solutions }}" >> $GITHUB_ENV
          echo "REQIN=${{ inputs.input }}" >> $GITHUB_ENV
          echo "REQOUT=${{ inputs.output }}" >> $GITHUB_ENV
          echo "REQSOL=${{ inputs.solutions }}" >> $GITHUB_ENV

      - name: Filter problems
        id: run-problems
        uses: TNFSH-Programming-Contest/tps-actions/.github/actions/run-problems@main
        with:
          requests: ${{ env.REQUEST }}

  build-tests:
    needs: [pre-build]
    if: needs.pre-build.outputs.problems != '[]'
    runs-on: ${{ inputs.runs-on }}
    container:
      image: tobiichi3227/tps-github-runner
      options: --user root
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      matrix:
        problem: ${{ fromJson(needs.pre-build.outputs.problems) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Allow Git to access workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Build inputs and outputs
        if: contains(needs.pre-build.outputs.input, matrix.problem)
        working-directory: p${{ matrix.problem }}
        run: |
          echo "Building input for ${{ matrix.problem }}"
          tps gen -s
          git status
          git add gen/data
          git add tests/*.in
          git add tests/*.out
          git add tests/gen_summary
          git add tests/mapping
          git pull
          git diff --cached --quiet || git commit -m "p${{ matrix.problem }} Build inputs and outputs

          Co-Authored-By: ${{ github.event.sender.login }} <${{ github.event.sender.id }}+${{ github.event.sender.login }}@users.noreply.github.com>"
          git push

      - name: Build outputs
        if: contains(needs.pre-build.outputs.output, matrix.problem) && !contains(needs.pre-build.outputs.input, matrix.problem)
        working-directory: p${{ matrix.problem }}
        run: |
          echo "Building output for ${{ matrix.problem }}"
          tps gen -s --no-gen
          git status
          git add tests/*.out
          git pull
          git diff --cached --quiet || git commit -m "p${{ matrix.problem }} Build outputs

          Co-Authored-By: ${{ github.event.sender.login }} <${{ github.event.sender.id }}+${{ github.event.sender.login }}@users.noreply.github.com>"
          git push

      - name: Check tests changes
        id: tests-changes
        run: |
          set +e

          git diff ${{ github.sha }}..HEAD --quiet p${{ matrix.problem }}/tests/*.in p${{ matrix.problem }}/tests/*.out
          if [ $? -ne 0 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Tests changed"
          else
            echo "No changes in tests";
          fi

      - name: Dispatch build-pdf when tests changed
        if: steps.tests-changes.outputs.changed == 'true'
        id: dispatch-build-pdf
        run: |
          echo "Dispatch build-pdf due to test changed"
          echo "${{ needs.pre-build.outputs.input }}"
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{
                  "ref": "${{ github.ref }}",
                  "inputs": {
                    "problems": "${{ needs.pre-build.outputs.input }}",
                    "merge": "true"
                  }
                }' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-pdf.yml/dispatches

      - name: Run solutions
        if: contains(needs.pre-build.outputs.solutions, matrix.problem) || steps.tests-changes.outputs.changed == 'true'
        working-directory: p${{ matrix.problem }}
        shell: bash
        run: |
          echo "Run solutions for ${{ matrix.problem }}"

          sol_check=solutions-check.txt
          tests_changed="${{ steps.tests-changes.outputs.changed }}"
          solfile_changes='${{ needs.pre-build.outputs.solfile-changes }}'

          # Check if solutions.json changed for this problem
          need_full_run="false"
          if echo "$solfile_changes" | jq -r '."${{ matrix.problem }}" // [] | .[]' | grep -q "solutions.json"; then
            need_full_run="true"
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            need_full_run="true"
          fi

          # Step 1: Check if full run needed
          if [ "$tests_changed" = "true" ] || [ ! -f "$sol_check" ] || [ "$need_full_run" = "true" ]; then
            echo "Full solution run mode (tests changed or no existing $sol_check or solutions.json changed)"
            tps solutions | tee "$sol_check"
            git status
            git add "$sol_check"
            git pull
            git diff --cached --quiet || git commit -m "p${{ matrix.problem }} Run solutions"
            git push
            exit 0
          fi

          # Incremental mode: use Python for steps 2-5
          python3 << 'PYTHON_EOF'
          import json
          import subprocess
          import sys
          import os

          sol_check = "solutions-check.txt"
          solfile_changes_str = '${{ needs.pre-build.outputs.solfile-changes }}'
          END_STRING = "Finished."

          # Load solutions.json
          with open("solutions.json", "r") as f:
              solutions_json = json.load(f)

          # Load solfile-changes
          solfile_changes = json.loads(solfile_changes_str)
          problem = "${{ matrix.problem }}"
          changed_files = [f.replace("solution/", "") for f in solfile_changes.get(problem, [])]

          # Filter by solutions.json existence
          valid_changed_files = [f for f in changed_files if f in solutions_json]

          if not valid_changed_files:
              print("No valid solution files changed; nothing to do")
              sys.exit(0)

          print(f"Changed solution files: {valid_changed_files}")

          # Step 2: Parse existing solutions-check.txt
          blocks = {}  # {sol_name: block_content}
          order = []    # [sol_name, sol_name, ...]

          with open(sol_check, "r") as f:
              lines = f.readlines()

          current_block = []
          current_sol = None

          for line in lines:
              line = line.rstrip("\n")

              if line.strip() == END_STRING:
                  # End current block
                  if current_sol and current_block:
                      current_block.append(line)
                      blocks[current_sol] = "\n".join(current_block)
                      order.append(current_sol)
                  current_block = []
                  current_sol = None
              elif current_sol is None and line.strip():
                  # Start new block with solution name
                  current_sol = line.strip()
                  current_block = [line]
              elif current_sol is not None:
                  # Continue appending to current block
                  current_block.append(line)

          # Handle last block if not ended with Finished.
          if current_sol and current_block:
              blocks[current_sol] = "\n".join(current_block)
              order.append(current_sol)

          print(f"Existing solutions in order: {order}")

          # Step 3: Process changes
          # Remove solutions that no longer exist or are in changed_files
          for sol_name in list(blocks.keys()):
              if sol_name not in order:
                  continue
              if sol_name in valid_changed_files:
                  print(f"Will update: {sol_name}")
              else:
                  if not os.path.exists(f"solution/{sol_name}"):
                      print(f"Dropped (missing file): {sol_name}")
                      del blocks[sol_name]

          # Step 4: Run changed solutions
          for sol in valid_changed_files:
              print(f"Running tps invoke for {sol}")
              result = subprocess.run(["tps", "invoke", f"solution/{sol}", "-r"],
                                    capture_output=True, text=True)
              out = result.stdout + result.stderr
              blocks[sol] = f"{sol}\n{out.strip()}"

          # Step 5: Build new solutions-check.txt in solutions.json order
          new_content = []
          for sol_name in solutions_json.keys():
              if sol_name in blocks:
                  new_content.append(blocks[sol_name])
                  new_content.append("")

          # Write back
          with open(sol_check, "w") as f:
              f.write("\n".join(new_content))

          print(f"Updated {sol_check}")
          PYTHON_EOF

          git status
          git add "$sol_check"
          git pull
          git diff --cached --quiet || git commit -m "p${{ matrix.problem }} Run solutions (incremental)"
          git push || true
